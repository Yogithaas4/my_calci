name: CI/CD pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 
          # Run flake8 if configured; don't fail the job if not present
          if [ -f .flake8 ] || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            python -m pip install flake8 || true
            flake8 || true
          else
            echo "No lint config found — skipping flake8"
          fi
